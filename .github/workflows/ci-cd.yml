name: CI/CD

on:
push:
branches: [main, staging]
pull_request:
branches: [main]

env:
AWS_REGION: us-east-1
ECR_REPOSITORY: b2b-rag-api
PYTHON_VERSION: "3.11"
NODE_VERSION: "20"

jobs:

# ─── API TESTS ─────────────────────────────

test-api:
runs-on: ubuntu-latest

```
services:
  postgres:
    image: pgvector/pgvector:pg16
    env:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: b2b_rag_test
    ports:
      - 5432:5432

  redis:
    image: redis:7-alpine
    ports:
      - 6379:6379

steps:
  - uses: actions/checkout@v4

  - name: Setup Python
    uses: actions/setup-python@v5
    with:
      python-version: ${{ env.PYTHON_VERSION }}

  - name: Install deps
    working-directory: apps/api
    run: pip install -r requirements.txt

  - name: Lint
    working-directory: apps/api
    run: ruff check .

  - name: Test
    working-directory: apps/api
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/b2b_rag_test
      REDIS_URL: redis://localhost:6379/0
    run: pytest -q
```

# ─── BUILD & PUSH ─────────────────────────

build-and-push:
runs-on: ubuntu-latest
needs: test-api
if: github.event_name == 'push'

```
steps:
  - uses: actions/checkout@v4

  - name: Set SHA
    id: vars
    run: echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

  - name: Configure AWS creds
    uses: aws-actions/configure-aws-credentials@v4
    with:
      aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
      aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      aws-region: ${{ env.AWS_REGION }}

  - name: Login to ECR
    id: ecr
    uses: aws-actions/amazon-ecr-login@v2

  - name: Build image
    run: |
      IMAGE=${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.vars.outputs.sha }}

      docker build -t $IMAGE ./apps/api
      docker tag $IMAGE ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest

      echo "IMAGE=$IMAGE" >> $GITHUB_ENV

  - name: Push image
    run: |
      docker push $IMAGE
      docker push ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
```
