# .github/workflows/ci-cd.yml
name: CI/CD

# ✅ CRITICAL: Grant OIDC token permission for AWS authentication
permissions:
  id-token: write  # Required for OIDC authentication with AWS
  contents: read   # Required for checkout action

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main]

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: b2b-rag-api
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  # ─── API TESTS ─────────────────────────────
  test-api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: b2b_rag_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: apps/api/requirements.txt

      - name: Install dependencies
        working-directory: apps/api
        run: pip install -r requirements.txt

      - name: Lint with Ruff
        working-directory: apps/api
        run: ruff check .

      # ✅ Run tests with REAL OpenAI API key from GitHub Secrets
      - name: Run tests
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/b2b_rag_test
          REDIS_URL: redis://localhost:6379/0
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}  # ← Real key from GitHub Secrets
          AWS_REGION: ${{ env.AWS_REGION }}
        run: pytest -q --tb=short

  # ─── BUILD & PUSH (Free Tier Optimized) ─────────────────────────
  build-and-push:
    runs-on: ubuntu-latest
    needs: test-api
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set short SHA
        id: vars
        run: echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      # 🔐 OIDC Auth via GitHub Actions identity (FIXED)
      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::131292875644:role/github-actions-b2b-rag-staging
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com
          # ✅ REMOVED: output-env-credentials: true (invalid parameter)

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      # ✅ Build & Push WITHOUT cache (Free Tier reliability)
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/api
          file: ./apps/api/Dockerfile
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.vars.outputs.sha }}
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          # ✅ Removed cache-from/cache-to to avoid Buildx driver complexity on Free Tier
          provenance: false

      - name: Output Image URI
        run: |
          echo "✅ Built and pushed:"
          echo "   ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.vars.outputs.sha }}"
          echo "   ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest"