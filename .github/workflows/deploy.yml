# .github/workflows/deploy.yml
name: Deploy FastAPI to EKS (OIDC)

on:
  push:
    branches: [main]  # ✅ Only trigger on direct pushes to main
  workflow_dispatch:

permissions:
  id-token: write  # ✅ Required for OIDC
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: b2b-rag-api
  KUSTOMIZE_PATH: infra/k8s/overlays/staging
  CLUSTER_NAME: b2b-rag-cluster
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 🔍 DEBUG: Show OIDC token claims (remove after fixing)
      - name: Debug: Show OIDC Token Claims
        run: |
          echo "🔍 Requesting OIDC token..."
          TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
          echo "✅ Token received (first 50 chars): ${TOKEN:0:50}..."
          
          # Decode JWT payload (base64url)
          PAYLOAD=$(echo "$TOKEN" | cut -d. -f2 | base64 -d 2>/dev/null || echo "[decode failed]")
          echo "📋 Decoded payload:"
          echo "$PAYLOAD" | jq -c '{sub, aud, iss, repository, ref}' 2>/dev/null || echo "$PAYLOAD"
          
          # Save sub claim for comparison
          SUB_CLAIM=$(echo "$PAYLOAD" | jq -r '.sub // empty' 2>/dev/null)
          echo "🔑 sub claim: $SUB_CLAIM"
          echo "SUB_CLAIM=$SUB_CLAIM" >> $GITHUB_ENV
        env:
          ACTIONS_ID_TOKEN_REQUEST_URL: ${{ actions.id-token-request-url }}
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 🔐 OIDC Auth - MINIMAL, HARDCODED, NO VARIABLES
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          role-to-assume: arn:aws:iam::131292875644:role/github-actions-b2b-rag-staging
          aws-region: us-east-1
          audience: sts.amazonaws.com

      - name: Verify Auth
        run: |
          echo "✅ Auth successful!"
          aws sts get-caller-identity

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: private

      - name: Build & Push
        run: |
          if [ -z "${{ secrets.ECR_REGISTRY }}" ]; then
            echo "::error::ECR_REGISTRY secret is not set!"
            exit 1
          fi
          
          IMG="${{ secrets.ECR_REGISTRY }}/b2b-rag-api:${{ github.sha }}"
          echo "🔨 Building: $IMG"
          
          docker build \
            -t "$IMG" \
            -f ./apps/api/Dockerfile \
            ./apps/api/
          
          docker push "$IMG"
          docker tag "$IMG" "${{ secrets.ECR_REGISTRY }}/b2b-rag-api:latest"
          docker push "${{ secrets.ECR_REGISTRY }}/b2b-rag-api:latest"
          
          echo "IMAGE_URI=$IMG" >> $GITHUB_ENV
          echo "✅ Pushed: $IMG"

      - name: Update Kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name $CLUSTER_NAME \
            --region $AWS_REGION \
            --role-arn arn:aws:iam::131292875644:role/github-actions-b2b-rag-staging

      - name: Install Kustomize
        run: |
          curl -sL https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh | bash
          sudo mv kustomize /usr/local/bin/

      - name: Deploy
        working-directory: ${{ env.KUSTOMIZE_PATH }}
        run: |
          echo "🔄 Updating Kustomize image to: $IMAGE_URI"
          kustomize edit set image b2b-rag-api=${{ env.IMAGE_URI }}
          
          echo "🚀 Applying manifests..."
          kustomize build . | kubectl apply --validate=false -f -
          
          echo "⏳ Waiting for rollout..."
          kubectl rollout status deployment/api --timeout=300s
          
          echo "✅ Deploy complete!"