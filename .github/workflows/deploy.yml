# .github/workflows/deploy.yml
name: Deploy FastAPI to EKS (Free Tier)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write  # Required for OIDC
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: b2b-rag-api
  KUSTOMIZE_PATH: infra/k8s/overlays/staging
  CLUSTER_NAME: b2b-rag-cluster
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 🔐 OIDC Auth
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          role-to-assume: arn:aws:iam::131292875644:role/github-actions-b2b-rag-staging
          aws-region: us-east-1
          audience: sts.amazonaws.com

      - name: Verify Auth
        run: aws sts get-caller-identity

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: private

      # ✅ Build & Push WITHOUT cache (simpler, avoids Buildx driver issues)
      - name: Build & Push
        uses: docker/build-push-action@v5
        with:
          context: ./apps/api
          file: ./apps/api/Dockerfile
          push: true
          tags: |
            ${{ secrets.ECR_REGISTRY }}/b2b-rag-api:${{ github.sha }}
            ${{ secrets.ECR_REGISTRY }}/b2b-rag-api:latest
          # ✅ Removed cache-from/cache-to to avoid Buildx driver complexity
          provenance: false

      - name: Export Image URI
        run: |
          IMG="${{ secrets.ECR_REGISTRY }}/b2b-rag-api:${{ github.sha }}"
          echo "IMAGE_URI=$IMG" >> $GITHUB_ENV

      # ✅ Update Kubeconfig WITHOUT --role-arn (already authenticated via OIDC)
      - name: Update Kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name $CLUSTER_NAME \
            --region $AWS_REGION

      - name: Install Kustomize
        run: |
          curl -sL https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh | bash
          sudo mv kustomize /usr/local/bin/

      - name: Deploy
        working-directory: ${{ env.KUSTOMIZE_PATH }}
        run: |
          echo "🔄 Updating Kustomize image to: $IMAGE_URI"
          kustomize edit set image b2b-rag-api=${{ env.IMAGE_URI }}
          
          echo "🚀 Applying manifests..."
          kustomize build . | kubectl apply --validate=false -f -
          
          echo "⏳ Waiting for rollout..."
          kubectl rollout status deployment/api --timeout=300s
          
          echo "✅ Deploy complete!"

      # 🔍 Debug step if rollout fails
      - name: Debug: Rollout Diagnostics
        if: failure()
        working-directory: ${{ env.KUSTOMIZE_PATH }}
        run: |
          echo "❌ Rollout failed — diagnostics:"
          kubectl get pods -l app=api -n default -o wide || true
          kubectl describe pod -l app=api -n default 2>/dev/null | grep -A 20 "Events:" || true
          kubectl logs -l app=api -n default --tail=50 || true
        continue-on-error: true