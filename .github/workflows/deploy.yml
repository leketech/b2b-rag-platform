# .github/workflows/deploy.yml
name: Deploy to EKS

# ✅ CRITICAL: Grant OIDC token permission for AWS authentication
permissions:
  id-token: write  # Required for OIDC authentication with AWS
  contents: read   # Required for checkout

on:
  workflow_run:
    workflows: ["CI/CD"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production

env:
  AWS_REGION: us-east-1
  CLUSTER_NAME: b2b-rag-cluster
  ECR_REGISTRY: 131292875644.dkr.ecr.us-east-1.amazonaws.com

jobs:
  # ─── STAGING DEPLOY ─────────────────────────────
  deploy-staging:
    if: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging') || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'staging') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 🔐 OIDC Auth via GitHub Actions identity
      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::131292875644:role/github-actions-b2b-rag-staging
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Update kubeconfig
        run: |
          echo "🔗 Updating kubeconfig for cluster: $CLUSTER_NAME"
          aws eks update-kubeconfig \
            --name $CLUSTER_NAME \
            --region $AWS_REGION \
            --alias $CLUSTER_NAME

      - name: Install Kustomize
        run: |
          echo "🔧 Installing Kustomize..."
          curl -sL https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh | bash
          sudo mv kustomize /usr/local/bin/
          kustomize version

      # ✅ FIXED: Get latest image tag from ECR (single tag, not tab-separated list)
      - name: Get latest image tag from ECR
        id: image
        run: |
          # Get the most recent image tag (excluding 'latest')
          # Use --output json + jq for reliable parsing
          TAG=$(aws ecr list-images \
            --repository-name b2b-rag-api \
            --region $AWS_REGION \
            --query 'imageIds[?imageTag!=`latest`].imageTag' \
            --output json | jq -r '.[]' | grep -E '^[0-9a-f]{7,40}$' | sort -V | tail -1)
          
          # Fallback: if no tag found, use 'latest'
          if [ -z "$TAG" ]; then
            echo "::warning::No semantic tag found in ECR, falling back to 'latest'"
            TAG="latest"
          fi
          
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "✅ Using image tag: $TAG"

      - name: Deploy to staging
        working-directory: infra/k8s/overlays/staging
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
        run: |
          set -euo pipefail

          echo "🔄 Setting image to: $ECR_REGISTRY/b2b-rag-api:${{ steps.image.outputs.tag }}"
          kustomize edit set image b2b-rag-api=$ECR_REGISTRY/b2b-rag-api:${{ steps.image.outputs.tag }}

          echo "🔐 Fetching RDS password from AWS Secrets Manager..."
          DB_PASSWORD=$(aws secretsmanager get-secret-value --secret-id b2b-rag-db-password --query SecretString --output text --region $AWS_REGION)
          DB_HOST="b2b-rag-db.cq52kugkmyq0.us-east-1.rds.amazonaws.com"
          DATABASE_URL="postgresql+asyncpg://postgres:$DB_PASSWORD@$DB_HOST:5432/b2b_rag_db"

          echo "🔐 Creating/updating Kubernetes secret b2b-rag-secrets..."
          kubectl create secret generic b2b-rag-secrets             --from-literal=DATABASE_URL="$DATABASE_URL"             --from-literal=REDIS_URL="redis://:<REDIS_PASSWORD>@<ELASTICACHE_ENDPOINT>:6379/0"             --from-literal=CELERY_BROKER_URL="redis://:<REDIS_PASSWORD>@<ELASTICACHE_ENDPOINT>:6379/0"             --from-literal=CELERY_RESULT_BACKEND="redis://:<REDIS_PASSWORD>@<ELASTICACHE_ENDPOINT>:6379/0"             --from-literal=ENVIRONMENT="staging"             --from-literal=LOG_LEVEL="INFO"             --from-literal=EMBEDDING_MODEL="text-embedding-3-small"             --from-literal=OPENAI_API_KEY="$OPENAI_API_KEY"             --from-literal=PINECONE_API_KEY="$PINECONE_API_KEY"             --from-literal=CHUNK_SIZE="512"             --from-literal=CHUNK_OVERLAP="50"             --from-literal=SLACK_BOT_TOKEN="xoxb-..."             --from-literal=SLACK_CHANNEL_ID="C0123456789"             --dry-run=client -o yaml | kubectl apply -f -

          echo "📋 Generated manifests (preview):"
          kustomize build . | head -30

          echo "🔴 Cleaning up stuck pods..."
          kubectl delete pods -l app=api --force --grace-period=0 2>/dev/null || true
          sleep 5  # Wait for pods to be removed

          echo "🚀 Applying manifests..."
          kustomize build . | kubectl apply --validate=false -f -

          echo "⏳ Waiting for rollout (timeout: 300s)..."
          kubectl rollout status deployment/api --timeout=300s

          echo "✅ Staging deploy complete!"

      - name: Verify staging deployment
        run: |
          echo "🔍 Verifying staging deployment..."
          kubectl get pods -l app=api -n default -o wide
          kubectl get svc -l app=api -n default
          
          # Test health endpoint if pod is running
          POD=$(kubectl get pods -l app=api -n default -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)
          if [ -n "$POD" ]; then
            echo "🔍 Testing health endpoint on pod: $POD"
            kubectl exec -n default "$POD" -- curl -s http://localhost:8000/api/v1/health || echo "⚠️ Health check failed"
          fi

      - name: Debug on failure
        if: failure()
        run: |
          echo "❌ Deploy failed — diagnostics:"
          kubectl get pods -l app=api -n default -o wide || true
          kubectl describe pod -l app=api -n default 2>/dev/null | grep -A 20 "Events:" || true
          kubectl logs -l app=api -n default --tail=50 || true
        continue-on-error: true

  # ─── PRODUCTION DEPLOY ─────────────────────────────
  deploy-prod:
    if: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production') || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    # Optional: Remove this line if you want prod to deploy independently of staging
    # needs: deploy-staging

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 🔐 OIDC Auth via GitHub Actions identity
      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::131292875644:role/github-actions-b2b-rag-staging
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Update kubeconfig
        run: |
          echo "🔗 Updating kubeconfig for cluster: $CLUSTER_NAME"
          aws eks update-kubeconfig \
            --name $CLUSTER_NAME \
            --region $AWS_REGION \
            --alias $CLUSTER_NAME

      - name: Install Kustomize
        run: |
          echo "🔧 Installing Kustomize..."
          curl -sL https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh | bash
          sudo mv kustomize /usr/local/bin/
          kustomize version

      # ✅ FIXED: Get latest image tag from ECR (single tag, not tab-separated list)
      - name: Get latest image tag from ECR
        id: image
        run: |
          TAG=$(aws ecr list-images \
            --repository-name b2b-rag-api \
            --region $AWS_REGION \
            --query 'imageIds[?imageTag!=`latest`].imageTag' \
            --output json | jq -r '.[]' | grep -E '^[0-9a-f]{7,40}$' | sort -V | tail -1)
          
          if [ -z "$TAG" ]; then
            echo "::warning::No semantic tag found, using 'latest'"
            TAG="latest"
          fi
          
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "✅ Using image tag: $TAG"

      - name: Deploy to production
        working-directory: infra/k8s/overlays/prod
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
        run: |
          set -euo pipefail

          echo "🔄 Setting image to: $ECR_REGISTRY/b2b-rag-api:${{ steps.image.outputs.tag }}"
          kustomize edit set image b2b-rag-api=$ECR_REGISTRY/b2b-rag-api:${{ steps.image.outputs.tag }}

          echo "🔐 Fetching RDS password from AWS Secrets Manager..."
          DB_PASSWORD=$(aws secretsmanager get-secret-value --secret-id b2b-rag-db-password --query SecretString --output text --region $AWS_REGION)
          DB_HOST="b2b-rag-db.cq52kugkmyq0.us-east-1.rds.amazonaws.com"
          DATABASE_URL="postgresql+asyncpg://postgres:$DB_PASSWORD@$DB_HOST:5432/b2b_rag_db"

          echo "🔐 Creating/updating Kubernetes secret b2b-rag-secrets..."
          kubectl create secret generic b2b-rag-secrets             --from-literal=DATABASE_URL="$DATABASE_URL"             --from-literal=REDIS_URL="redis://:<REDIS_PASSWORD>@<ELASTICACHE_ENDPOINT>:6379/0"             --from-literal=CELERY_BROKER_URL="redis://:<REDIS_PASSWORD>@<ELASTICACHE_ENDPOINT>:6379/0"             --from-literal=CELERY_RESULT_BACKEND="redis://:<REDIS_PASSWORD>@<ELASTICACHE_ENDPOINT>:6379/0"             --from-literal=ENVIRONMENT="production"             --from-literal=LOG_LEVEL="INFO"             --from-literal=EMBEDDING_MODEL="text-embedding-3-small"             --from-literal=OPENAI_API_KEY="$OPENAI_API_KEY"             --from-literal=PINECONE_API_KEY="$PINECONE_API_KEY"             --from-literal=CHUNK_SIZE="512"             --from-literal=CHUNK_OVERLAP="50"             --from-literal=SLACK_BOT_TOKEN="xoxb-..."             --from-literal=SLACK_CHANNEL_ID="C0123456789"             --dry-run=client -o yaml | kubectl apply -f -

          echo "📋 Generated manifests (preview):"
          kustomize build . | head -30

          echo "🔴 Cleaning up stuck pods..."
          kubectl delete pods -l app=api --force --grace-period=0 2>/dev/null || true
          sleep 5  # Wait for pods to be removed

          echo "🚀 Applying manifests..."
          kustomize build . | kubectl apply --validate=false -f -

          echo "⏳ Waiting for rollout (timeout: 300s)..."
          kubectl rollout status deployment/api --timeout=300s

          echo "✅ Production deploy complete!"

      - name: Verify production deployment
        run: |
          echo "🔍 Verifying production deployment..."
          kubectl get pods -l app=api -n default -o wide
          kubectl get svc -l app=api -n default
          
          POD=$(kubectl get pods -l app=api -n default -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)
          if [ -n "$POD" ]; then
            echo "🔍 Testing health endpoint on pod: $POD"
            kubectl exec -n default "$POD" -- curl -s http://localhost:8000/api/v1/health || echo "⚠️ Health check failed"
          fi

      - name: Debug on failure
        if: failure()
        run: |
          echo "❌ Deploy failed — diagnostics:"
          kubectl get pods -l app=api -n default -o wide || true
          kubectl describe pod -l app=api -n default 2>/dev/null | grep -A 20 "Events:" || true
          kubectl logs -l app=api -n default --tail=50 || true
        continue-on-error: true