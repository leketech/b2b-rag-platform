# .github/workflows/deploy.yml
name: Deploy FastAPI to EKS (OIDC)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: b2b-rag-api
  KUSTOMIZE_PATH: infra/k8s/overlays/staging
  CLUSTER_NAME: b2b-rag-cluster
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          role-to-assume: arn:aws:iam::131292875644:role/github-actions-b2b-rag-staging
          aws-region: us-east-1
          audience: sts.amazonaws.com

      - name: Verify Auth
        run: aws sts get-caller-identity

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: private

      - name: Build & Push
        run: |
          if [ -z "${{ secrets.ECR_REGISTRY }}" ]; then
            echo "::error::ECR_REGISTRY secret is not set!"
            exit 1
          fi
          
          IMG="${{ secrets.ECR_REGISTRY }}/b2b-rag-api:${{ github.sha }}"
          echo "🔨 Building: $IMG"
          
          docker build \
            -t "$IMG" \
            -f ./apps/api/Dockerfile \
            ./apps/api/
          
          docker push "$IMG"
          docker tag "$IMG" "${{ secrets.ECR_REGISTRY }}/b2b-rag-api:latest"
          docker push "${{ secrets.ECR_REGISTRY }}/b2b-rag-api:latest"
          
          echo "IMAGE_URI=$IMG" >> $GITHUB_ENV
          echo "✅ Pushed: $IMG"

      - name: Update Kubeconfig
        run: |
          # Explicitly bind kubeconfig to the assumed OIDC role
          aws eks update-kubeconfig \
            --name $CLUSTER_NAME \
            --region $AWS_REGION \
            --role-arn arn:aws:iam::131292875644:role/github-actions-b2b-rag-staging
          
          # Quick RBAC check
          echo "🔍 Testing cluster access..."
          kubectl auth can-i get pods --all-namespaces || echo "⚠️ RBAC check failed (check aws-auth)"

      - name: Install Kustomize
        run: |
          curl -sL https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh | bash
          sudo mv kustomize /usr/local/bin/

      - name: Deploy
        working-directory: ${{ env.KUSTOMIZE_PATH }}
        run: |
          echo "🔄 Updating Kustomize image to: $IMAGE_URI"
          kustomize edit set image b2b-rag-api=${{ env.IMAGE_URI }}
          
          echo "🚀 Applying manifests..."
          # ✅ --validate=false skips OpenAPI schema download (standard for CI/CD)
          kustomize build . | kubectl apply --validate=false -f -
          
          echo "⏳ Waiting for rollout..."
          kubectl rollout status deployment/api --timeout=300s
          
          echo "✅ Deploy complete!"