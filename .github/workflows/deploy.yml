# .github/workflows/deploy.yml
name: Deploy FastAPI to EKS (OIDC)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: b2b-rag-api
  KUSTOMIZE_PATH: infra/k8s/overlays/staging
  CLUSTER_NAME: b2b-rag-cluster
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 🔐 OIDC Auth - assumes the role via GitHub OIDC
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          role-to-assume: arn:aws:iam::131292875644:role/github-actions-b2b-rag-staging
          aws-region: us-east-1
          audience: sts.amazonaws.com

      - name: Verify Auth
        run: |
          echo "✅ Authenticated as:"
          aws sts get-caller-identity --query '[Account,Arn,UserId]' --output text

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: private

      # ✅ Set up Docker Buildx with explicit builder name
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
          driver-opts: |
            image=moby/buildkit:latest
          buildkitd-flags: --debug

      # ✅ Build & Push — explicitly reference the builder
      - name: Build & Push
        uses: docker/build-push-action@v5
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: ./apps/api
          file: ./apps/api/Dockerfile
          push: true
          tags: |
            ${{ secrets.ECR_REGISTRY }}/b2b-rag-api:${{ github.sha }}
            ${{ secrets.ECR_REGISTRY }}/b2b-rag-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      # ✅ Export IMAGE_URI for Kustomize step
      - name: Export Image URI
        run: |
          IMG="${{ secrets.ECR_REGISTRY }}/b2b-rag-api:${{ github.sha }}"
          echo "IMAGE_URI=$IMG" >> $GITHUB_ENV
          echo "✅ Image URI: $IMG"

      # ✅ FIX: Update Kubeconfig WITHOUT --role-arn (already running as the role)
      - name: Update Kubeconfig
        run: |
          echo "🔗 Updating kubeconfig for cluster: $CLUSTER_NAME"
          aws eks update-kubeconfig \
            --name $CLUSTER_NAME \
            --region $AWS_REGION
          # ✅ No --role-arn needed — OIDC credentials are already in env

      - name: Install Kustomize
        run: |
          curl -sL https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh | bash
          sudo mv kustomize /usr/local/bin/

      - name: Deploy
        working-directory: ${{ env.KUSTOMIZE_PATH }}
        run: |
          echo "🔄 Updating Kustomize image to: $IMAGE_URI"
          kustomize edit set image b2b-rag-api=${{ env.IMAGE_URI }}
          
          echo "🚀 Applying manifests..."
          kustomize build . | kubectl apply --validate=false -f -
          
          echo "⏳ Waiting for rollout..."
          kubectl rollout status deployment/api --timeout=300s
          
          echo "✅ Deploy complete!"

                # 🔍 DEBUG: Capture diagnostics if rollout fails
      - name: Debug: Rollout Diagnostics
        if: failure()
        working-directory: ${{ env.KUSTOMIZE_PATH }}
        run: |
          echo "❌ Rollout failed — collecting diagnostics:"
          
          echo "📋 Pod status:"
          kubectl get pods -l app=api -n default -o wide || true
          
          echo "📋 Pod events:"
          kubectl describe pod -l app=api -n default 2>/dev/null | grep -A 20 "Events:" || true
          
          echo "📋 Pod logs:"
          kubectl logs -l app=api -n default --tail=50 || true
          kubectl logs -l app=api -n default --previous --tail=50 2>/dev/null || true
          
          echo "📋 Node resources:"
          kubectl top nodes 2>/dev/null || echo "⚠️ Metrics server not available"
          
          echo "📋 Deployment status:"
          kubectl describe deployment api -n default | grep -A 10 "Conditions:" || true
        continue-on-error: true