name: Deploy FastAPI to EKS (Free Tier)

on:
push:
branches: [main]
workflow_dispatch:

permissions:
id-token: write
contents: read

env:
AWS_REGION: us-east-1
ECR_REPOSITORY: b2b-rag-api
KUSTOMIZE_PATH: infra/k8s/overlays/staging
CLUSTER_NAME: b2b-rag-cluster

jobs:
build-and-deploy:
runs-on: ubuntu-latest
environment: staging
timeout-minutes: 30

```
steps:
  # 📥 Checkout repo
  - name: Checkout
    uses: actions/checkout@v4

  # 🔐 Authenticate with AWS via OIDC
  - name: Configure AWS Credentials
    uses: aws-actions/configure-aws-credentials@v3
    with:
      role-to-assume: arn:aws:iam::131292875644:role/github-actions-b2b-rag-staging
      aws-region: ${{ env.AWS_REGION }}

  - name: Verify Auth
    run: aws sts get-caller-identity

  # 🔑 Login to ECR
  - name: Login to ECR
    uses: aws-actions/amazon-ecr-login@v2

  # 🐳 Build & Push (NO CACHE, NO BUILDX ISSUES)
  - name: Build Docker Image
    run: |
      IMAGE_URI=${{ secrets.ECR_REGISTRY }}/b2b-rag-api:${{ github.sha }}
      echo "Building image: $IMAGE_URI"

      docker build -t $IMAGE_URI ./apps/api
      docker tag $IMAGE_URI ${{ secrets.ECR_REGISTRY }}/b2b-rag-api:latest

      echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV

  - name: Push Docker Image
    run: |
      docker push $IMAGE_URI
      docker push ${{ secrets.ECR_REGISTRY }}/b2b-rag-api:latest

  # ⚙️ Configure kubectl for EKS
  - name: Update Kubeconfig
    run: |
      aws eks update-kubeconfig \
        --name $CLUSTER_NAME \
        --region $AWS_REGION

  # 📦 Install Kustomize
  - name: Install Kustomize
    run: |
      curl -sL https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh | bash
      sudo mv kustomize /usr/local/bin/

  # 🚀 Deploy to EKS
  - name: Deploy
    working-directory: ${{ env.KUSTOMIZE_PATH }}
    run: |
      echo "Updating image to: $IMAGE_URI"
      kustomize edit set image b2b-rag-api=$IMAGE_URI

      echo "Applying manifests..."
      kustomize build . | kubectl apply --validate=false -f -

      echo "Waiting for rollout..."
      kubectl rollout status deployment/api --timeout=300s

  # 🔍 Debug if deployment fails
  - name: Debug
    if: failure()
    run: |
      echo "Deployment failed. Debugging..."
      kubectl get pods -o wide
      kubectl describe pods | grep -A 20 Events || true
      kubectl logs -l app=api --tail=50 || true
```
