apiVersion: v1
kind: Secret
metadata:
  name: b2b-rag-secrets
stringData:
  ENVIRONMENT: "production"
  # Use memory broker for Free Tier (no Redis/ElastiCache available)
  CELERY_BROKER_URL: "memory://"
  CELERY_RESULT_BACKEND: "cache+memory://"
  # Pinecone for vector storage in production (Free Tier compatible)
  PINECONE_API_KEY: "your-pinecone-api-key-here"
