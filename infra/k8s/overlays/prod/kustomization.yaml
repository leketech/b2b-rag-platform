# infra/k8s/overlays/prod/kustomization.yaml
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# ConfigMap patch: override ENVIRONMENT and APP_SECRET_NAME for production
patches:
  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: b2b-rag-config
      data:
        ENVIRONMENT: "production"
        APP_SECRET_NAME: "b2b-rag/production/app-secrets"

# ✅ Image configuration for prod deployment
images:
  - name: b2b-rag-api
    newName: 131292875644.dkr.ecr.us-east-1.amazonaws.com/b2b-rag-api
    newTag: latest  # Will be overridden by deploy workflow

labels:
  - pairs:
      environment: prod
    includeSelectors: false  # ← CRITICAL: Don't modify immutable selector