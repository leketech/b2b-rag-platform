apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

images:
  - name: b2b-rag-api
    newName: ${ECR_REGISTRY:-123456789012.dkr.ecr.us-east-1.amazonaws.com}/b2b-rag-api
    newTag: ${IMAGE_TAG:-stable}  # Prod uses stable tag

commonLabels:
  environment: prod

patches:
  - target:
      kind: Deployment
      name: api
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3  # More replicas in prod