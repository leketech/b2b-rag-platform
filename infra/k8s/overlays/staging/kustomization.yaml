# infra/k8s/overlays/staging/kustomization.yaml
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  - patch: |-
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: b2b-rag-api
        annotations:
          eks.amazonaws.com/role-arn: "arn:aws:iam::131292875644:role/b2b-rag-staging-app-irsa"

# ✅ Image configuration for staging deployment
images:
  - name: b2b-rag-api
    newName: 131292875644.dkr.ecr.us-east-1.amazonaws.com/b2b-rag-api
    newTag: latest  # Will be overridden by deploy workflow

labels:
  - pairs:
      environment: staging
    includeSelectors: false  # ← CRITICAL: Don't modify immutable selector