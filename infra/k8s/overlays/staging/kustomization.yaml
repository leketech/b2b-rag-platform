apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
# 🔄 Image will be set by CI/CD via: kustomize edit set image ...
images:
  - name: b2b-rag-api
    newTag: "placeholder"
# Optional: staging-specific patches
patches:
  - target:
      kind: Deployment
      name: api
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1  # Single replica for Free Tier staging