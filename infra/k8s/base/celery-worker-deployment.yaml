apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-worker
  labels: { app: celery-worker }
spec:
  replicas: 2
  selector:
    matchLabels: { app: celery-worker }
  template:
    metadata:
      labels: { app: celery-worker }
    spec:
      serviceAccountName: b2b-rag-api
      containers:
        - name: worker
          image: b2b-rag-api:latest
          imagePullPolicy: Always
          command: ["celery", "-A", "app.core.celery_app", "worker", "--loglevel=info", "--concurrency=4"]
          envFrom:
            - configMapRef:
                name: b2b-rag-config
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits: { cpu: "1000m", memory: "1Gi" }
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000