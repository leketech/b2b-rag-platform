apiVersion: apps/v1
kind: Deployment
metadata:
  name: flower
  labels: { app: flower }
spec:
  replicas: 1
  selector:
    matchLabels: { app: flower }
  template:
    metadata:
      labels: { app: flower }
    spec:
      containers:
        - name: flower
          image: b2b-rag-api:latest
          imagePullPolicy: Always
          command: ["celery", "-A", "app.core.celery_app", "flower", "--port=5555"]
          ports:
            - containerPort: 5555
          envFrom:
            - secretRef:
                name: b2b-rag-secrets
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits: { cpu: "250m", memory: "512Mi" }
          livenessProbe:
            httpGet: { path: /, port: 5555 }
            initialDelaySeconds: 10
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: flower
spec:
  selector: { app: flower }
  ports:
    - port: 5555
      targetPort: 5555
  type: ClusterIP