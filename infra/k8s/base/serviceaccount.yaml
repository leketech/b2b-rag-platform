# infra/k8s/base/serviceaccount.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: b2b-rag-api
  labels:
    app: api
    project: b2b-rag
  annotations:
    # IRSA: grants the pod identity to call secretsmanager:GetSecretValue
    # ARN is set by the deploy workflow using the Terraform output app_irsa_role_arn.
    eks.amazonaws.com/role-arn: REPLACE_WITH_APP_IRSA_ROLE_ARN