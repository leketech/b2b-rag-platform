# infra/k8s/base/api-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app: api
    project: b2b-rag
spec:
  replicas: 1
  strategy:
    type: Recreate  # ← Kill old pod before starting new (avoids resource contention on single node)
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
        project: b2b-rag
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: b2b-rag-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      volumes:
        - name: tmp-volume
          emptyDir: {}
        - name: app-cache
          emptyDir: {}
      containers:
        - name: api
          image: b2b-rag-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: b2b-rag-secrets
          # ✅ Free Tier Optimized Resources
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "300m"    # ← Slightly higher burst for cold start
              memory: "384Mi" # ← Increased from 256Mi to prevent OOM on startup
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
            - name: app-cache
              mountPath: /app/.cache
          # ✅ More Forgiving Probes for Low-Resource Cold Starts
          startupProbe:  # ← NEW: Gives app extra time to start before readiness checks begin
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30  # ← Allow up to 5 minutes for cold start (30 × 10s)
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 15  # ← Wait 15s after startupProbe passes
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 60  # ← Wait 60s before checking liveness
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    app: api
spec:
  selector:
    app: api
  ports:
    - port: 80
      targetPort: 8000
      protocol: TCP
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api
  minReplicas: 1
  maxReplicas: 1  # ← Keep at 1 for Free Tier single-node setup
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80