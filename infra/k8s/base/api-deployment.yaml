# infra/k8s/base/api-deployment.yaml
# =============================================================================
# Free Tier Optimized: Single t3.micro node (1 GiB RAM total)
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app: api
    project: b2b-rag
spec:
  revisionHistoryLimit: 1  # ← CRITICAL: Clean up old replicas to free node memory
  replicas: 1  # Single replica to fit in 1 GiB
  strategy:
    type: Recreate  # Kill old before starting new (avoids memory contention)
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
        project: b2b-rag
      annotations:
        # Disabled Prometheus scraping to save ~30-50Mi RAM on memory-constrained nodes
        prometheus.io/scrape: "false"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: b2b-rag-api
      
      # Tolerations to allow scheduling on tainted nodes in constrained environments
      tolerations:
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 300
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 300
      
      # Security context (kept for defense-in-depth)
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      
      # ✅ Writable volumes for readOnlyRootFilesystem compatibility
      volumes:
        - name: tmp-volume
          emptyDir: {}
        - name: app-cache
          emptyDir: {}
      
      containers:
        - name: api
          image: b2b-rag-api:latest
          imagePullPolicy: IfNotPresent  # Save bandwidth on Free Tier
          
          ports:
            - containerPort: 8000
          
          envFrom:
            - secretRef:
                name: b2b-rag-secrets
          
          # ✅ Free Tier Resource Limits (critical for 1 GiB node)
          resources:
            requests:
              cpu: "50m"      # Minimal CPU request
              memory: "350Mi" # Match actual consumption observed (~430MB)
            limits:
              cpu: "200m"     # Reduce burst limit
              memory: "600Mi" # Allow up to 600Mi to prevent eviction
          
          # ✅ Writable mounts for app that needs disk writes
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
            - name: app-cache
              mountPath: /app/.cache  # Adjust if your app writes elsewhere
          
          # ✅ Forgiving probes for slow cold starts on low CPU
          startupProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3  # Fast timeout to detect startup quickly
            failureThreshold: 120  # Allow up to 10 minutes for cold start (5s * 120)
          
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 10  # ← Increased timeout
            failureThreshold: 5
          
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          
          # Security context (kept for defense-in-depth)
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    app: api
spec:
  selector:
    app: api
  ports:
    - port: 80
      targetPort: 8000
      protocol: TCP
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api
  minReplicas: 1
  maxReplicas: 1  # Keep at 1 for single-node Free Tier setup
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80  # Higher threshold to avoid premature scaling