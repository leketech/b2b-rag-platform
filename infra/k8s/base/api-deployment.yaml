apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app: api
    project: b2b-rag
spec:
  replicas: 1  # ← Single replica to fit in 1 GiB node
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
        project: b2b-rag
      # ✅ Optional: Remove Prometheus annotations to save ~50Mi RAM if not needed
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: b2b-rag-api
      
      # Security context (kept for security, but ensure app doesn't need writes)
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      
      # ✅ CRITICAL: Add writable volumes for readOnlyRootFilesystem compatibility
      volumes:
        - name: tmp-volume
          emptyDir: {}
        - name: app-cache
          emptyDir: {}
      
      containers:
        - name: api
          # 🔄 Kustomize will replace this image
          image: b2b-rag-api:latest
          imagePullPolicy: IfNotPresent  # ← Save bandwidth on free tier
          
          ports:
            - containerPort: 8000
          
          envFrom:
            - secretRef:
                name: b2b-rag-secrets
          
          # ✅ OPTIMIZED: Minimal resources for t3.micro (1 GiB total)
          resources:
            requests:
              cpu: "50m"      # ← Reduced from 250m (5% of 1 vCPU)
              memory: "128Mi" # ← Reduced from 512Mi (12.5% of 1 GiB)
            limits:
              cpu: "200m"     # ← Reduced from 1000m (burst allowed)
              memory: "256Mi" # ← Reduced from 1Gi (hard limit to prevent OOM)
          
          # ✅ Mount writable volumes (required for readOnlyRootFilesystem)
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
            - name: app-cache
              mountPath: /app/.cache  # Adjust if your app writes elsewhere
          
          # ✅ Relaxed probes for low-resource testing (adjust after validation)
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 20  # ← Increased: app may start slower with low CPU
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 45  # ← Increased: allow time for cold start
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          
          # Security context (kept for defense-in-depth)
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    app: api
spec:
  selector:
    app: api
  ports:
    - port: 80
      targetPort: 8000
      protocol: TCP
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api
  minReplicas: 1  # ← Start with 1 replica (Free Tier constraint)
  maxReplicas: 2  # ← Max 2 to avoid overcommitting the single node
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80  # ← Higher threshold to avoid premature scaling