apiVersion: v1
kind: Secret
metadata:
  name: b2b-rag-secrets
  labels:
    app: api
    project: b2b-rag
type: Opaque
stringData:
  # ✅ PostgreSQL (asyncpg) connection string
  DATABASE_URL: "postgresql+asyncpg://postgres:YOUR_PASSWORD@b2b-rag-db.<RDS_ENDPOINT>.us-east-1.rds.amazonaws.com:5432/b2b_rag_db"
  
  # ✅ Redis (Celery broker + cache)
  REDIS_URL: "redis://:<REDIS_PASSWORD>@<ELASTICACHE_ENDPOINT>:6379/0"
  
  # ✅ App config
  ENVIRONMENT: "staging"
  LOG_LEVEL: "INFO"
  
  # ✅ RAG / AI config (add your actual values)
  OPENAI_API_KEY: "sk-..."
  EMBEDDING_MODEL: "text-embedding-3-small"
  CHUNK_SIZE: "512"
  CHUNK_OVERLAP: "50"
  
  # ✅ Celery config
  CELERY_BROKER_URL: "redis://:<REDIS_PASSWORD>@<ELASTICACHE_ENDPOINT>:6379/0"
  CELERY_RESULT_BACKEND: "redis://:<REDIS_PASSWORD>@<ELASTICACHE_ENDPOINT>:6379/0"
  
  # ✅ Slack (for notifications)
  SLACK_BOT_TOKEN: "xoxb-..."
  SLACK_CHANNEL_ID: "C0123456789"