# infra/k8s/base/kustomization.yaml
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - api-deployment.yaml
  - serviceaccount.yaml
  - secret.yaml

# Secret values are injected at deploy time from AWS Secrets Manager
# via GitHub Actions, not managed directly in Kustomize.
# This keeps the DB password out of Git history and avoids placeholder
# overwrite issues during deployment.

# ✅ Image configuration for deploy workflow
images:
  - name: b2b-rag-api
    newName: b2b-rag-api  # Default; will be overridden in overlays

# ✅ Use new 'labels' syntax (replaces deprecated 'commonLabels')
labels:
  - pairs:
      project: b2b-rag
      managed-by: kustomize
    includeSelectors: false  # ← CRITICAL: Don't add to selector.matchLabels