# infra/k8s/base/kustomization.yaml
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - configmap.yaml
  - api-deployment.yaml
  - celery-worker-deployment.yaml
  - celery-beat-deployment.yaml
  - serviceaccount.yaml

# Sensitive secrets are never stored in K8s Secrets or Git.
# The app pod fetches them directly from AWS Secrets Manager at startup
# using the IRSA role annotated on the b2b-rag-api ServiceAccount.

# ✅ Image configuration for deploy workflow
images:
  - name: b2b-rag-api
    newName: b2b-rag-api  # Default; will be overridden in overlays

# ✅ Use new 'labels' syntax (replaces deprecated 'commonLabels')
labels:
  - pairs:
      project: b2b-rag
      managed-by: kustomize
    includeSelectors: false  # ← CRITICAL: Don't add to selector.matchLabels